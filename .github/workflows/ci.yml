name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy scipy soundfile
      - run: npm test
      - run: python -B test/adapter-cpu.py
      - run: python -m compileall -q runtime test
      - run: npm pack --dry-run
