# Example paths: replace every external directory for your machine.
# dsh-cover-pipeline —— 开发模式叠加层（零改动试用）
#
# 用法（**不修改任何 profile**，适合先试用 / 回归）：
#   "<DSH>/dsh.cmd" web --patch "<plugin>\cordis.dev.yml"
#
# 与 cordis.patch.yml 的区别：
#   · cordis.patch.yml  —— 随包分发，`dsh plugin add` 之后由 bundle 机制自动加载（长期安装）
#   · cordis.dev.yml    —— 只通过 --patch 生效（临时试用；本文件里的 name 用**绝对路径**
#                          直接指向插件目录，不需要先装进 profile 的 node_modules）
#
# 生效验证（只读，不挂载）：
#   dsh.cmd web --patch <本文件> --dump-config | Select-String cover-pipeline
- insert:
    - id: cover-pipeline-dev
      name: 'file:///C:/AudioWork/dsh-plugin-cover/src/index.js'
      config:
        songRoot: 'C:/AudioWork'
        pipelineRoot: 'C:/AudioWork/pipeline'
        probeDir: 'C:/AudioWork/pipeline/_probe'
        mixDir: 'C:/AudioTools/mix'
        msstDir: 'C:/AudioTools/MSST'
        msstEnv: 'C:/AudioTools/MSST/env/python.exe'
        ddspDir: 'C:/AudioTools/DDSP'
        ddspEnv: 'C:/AudioTools/DDSP/env/python.exe'
        ffmpeg: 'C:/AudioTools/MSST/env/ffmpeg.exe'
        voiceModel: 'C:/AudioModels/voice/model.pt'
        qualityLibDir: 'C:/AudioWork/pipeline/_probe/_sq'
        targetLufs: -14.0
        timeoutMs: 3600000
        maxOutputChars: 6000
