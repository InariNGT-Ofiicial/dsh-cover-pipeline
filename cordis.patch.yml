# Example paths: replace every external directory for your machine.
# dsh-cover-pipeline bundle patch
#
# 本文件随插件包一起分发；`dsh plugin add` 之后，dsh 启动时会自动加载它。
# 叠加顺序：dsh-base → dsh-web-app → 本 bundle patch → profile 的 cordis.patch.yml → --patch
#
# 环境变量（可选，优先级低于 config）：
#   DSH_COVER_ROOT   - AI-Song 根目录，默认 C:/AudioWork
#   DSH_COVER_PROBE  - 脚本与产物目录，默认 <root>/_pipeline_bqll/_probe
#
# 注意：patch 会**整行替换**目标行的 config，故此处列出本插件所需的全部键。
- insert:
    - id: cover-pipeline
      name: 'dsh-cover-pipeline'
      config:
        # ── 目录（示例值必须按实际环境配置，见 src/config.js）──────────────
        songRoot: !!js process.env.DSH_COVER_ROOT ?? 'C:/AudioWork'
        pipelineRoot: !!js (process.env.DSH_COVER_ROOT ?? 'C:/AudioWork') + '/_pipeline_bqll'
        probeDir: !!js process.env.DSH_COVER_PROBE ?? 'C:/AudioWork/pipeline/_probe'
        mixDir: 'C:/AudioTools/mix'

        # ── 两套 Python 环境（另需外部工程、模型与兼容混音脚本）────────────
        # MSST：人声分离 + 混音（需要 pyloudnorm / pedalboard / soundfile / librosa）
        msstDir: 'C:/AudioTools/MSST'
        msstEnv: 'C:/AudioTools/MSST/env/python.exe'
        # DDSP：换声推理（需要 torch / torchcrepe，不需要 pedalboard）
        ddspDir: 'C:/AudioTools/DDSP'
        ddspEnv: 'C:/AudioTools/DDSP/env/python.exe'

        # ── 其它外部件 ────────────────────────────────────────────────
        ffmpeg: 'C:/AudioTools/MSST/env/ffmpeg.exe'
        voiceModel: 'C:/AudioModels/voice/model.pt'
        # 音质指标库（mosqito/mutagen，用 pip --target 装的独立目录；没有则 p95/p97 降级）
        qualityLibDir: 'C:/AudioWork/pipeline/_probe/_sq'

        # ── 业务默认值 ────────────────────────────────────────────────
        targetLufs: -14.0
        timeoutMs: 3600000
        maxOutputChars: 6000
