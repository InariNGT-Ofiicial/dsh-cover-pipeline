# dsh-cover-pipeline bundle patch
#
# 本文件随插件包一起分发；`dsh plugin add` 之后，dsh 启动时会自动加载它。
# 叠加顺序：dsh-base → dsh-web-app → 本 bundle patch → profile 的 cordis.patch.yml → --patch
#
# ★ 路径默认全留空：安装后由 src/config.js **自动发现**
#   - 依次尝试 DSH_COVER_ROOT、D:/AI-Song、C:/AudioWork、cwd
#   - 在根目录里找 01_*（MSST）、02_*/DDSP-barbara-*（DDSP）、03_*（音色库）
#   - 脚本默认用仓库自带的 pipeline/（15 个），不需要另配 probeDir
#   发现不到时，运行 `cover_setup` 会给出可直接粘的配置片段。
#
# 环境变量（可选）：
#   DSH_COVER_ROOT   - AI-Song 根目录
#   DSH_COVER_PROBE  - 工程数据目录，默认 <root>/_pipeline_bqll/_probe
#
# 注意：patch 会**整行替换**目标行的 config，故此处列出本插件所需的全部键。
- insert:
    - id: cover-pipeline
      name: 'dsh-cover-pipeline'
      config:
        # ── 目录（留空 = 自动发现）────────────────────────────────────
        songRoot: !!js process.env.DSH_COVER_ROOT ?? ''
        pipelineRoot: ''
        probeDir: !!js process.env.DSH_COVER_PROBE ?? ''
        mixDir: ''

        # ── 两套 Python 环境（外部硬依赖；留空 = 在 01_/02_ 里找 env/python.exe）
        msstDir: ''
        msstEnv: ''
        ddspDir: ''
        ddspEnv: ''

        # ── 其它外部件（留空 = 自动发现）──────────────────────────────
        ffmpeg: ''
        voiceModel: ''
        voiceLibDir: ''
        # 音质指标库（mosqito/mutagen，用 pip --target 装的独立目录；没有则 p95/p97 降级）
        qualityLibDir: ''

        # ── 业务默认值 ────────────────────────────────────────────────
        targetLufs: -14.0
        timeoutMs: 3600000
        maxOutputChars: 6000
